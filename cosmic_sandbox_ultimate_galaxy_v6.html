<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Sandbox Ultimate Galaxy</title>
<style>
html,body{margin:0;overflow:hidden;background:black;font-family:Arial}
#ui{
position:absolute;left:10px;top:10px;width:340px;max-height:95vh;
overflow:auto;background:rgba(0,0,0,.82);padding:14px;
border-radius:16px;color:white;z-index:5
}
label{display:block;margin-top:10px;font-size:13px}
input,select,button{width:100%;margin-top:4px}
button{
padding:10px;border:none;border-radius:10px;background:#2b6fff;
color:white;font-weight:bold;cursor:pointer;margin-top:10px
}
.catalogItem{
background:rgba(255,255,255,.08);
padding:8px;margin-top:6px;border-radius:8px;cursor:pointer
}
#crosshair{
position:absolute;left:50%;top:50%;width:6px;height:6px;
margin-left:-3px;margin-top:-3px;background:white;border-radius:50%
}
</style>
</head>
<body>

<div id="ui">
<h2>Cosmic Sandbox</h2>
<p>
M = Toggle Menu<br>
P = Place Object<br>
L = Save Location<br>
1 = Slower Speed<br>
2 = Faster Speed
</p>

<label>Object Type</label>
<select id="type">
<option value="planet">Rocky Planet</option>
<option value="gas">Gas Giant</option>
<option value="star">Star</option>
<option value="blackhole">Black Hole</option>
<option value="galaxy">Galaxy</option>
</select>

<label>Radius</label>
<input id="radius" type="range" min="5" max="120" value="20">

<label>Continent Size</label>
<input id="continentSize" type="range" min="1" max="100" value="50">

<label>Mountain Height</label>
<input id="mountainScale" type="range" min="0" max="100" value="8">





<label>Terrain Height</label>
<input <input id="terrainHeight" type="range" min="0" max="300" value="35"><input

<label>Continent Detail</label>
<input id="continentDetail" type="range" min="1" max="100" value="55">

<label>Enable Trees</label>
<input id="enableTrees" type="checkbox" checked>

<label>Tree Density</label>
<input id="treeDensity" type="range" min="0" max="200" value="60">

<label>Enable Rocks</label>
<input id="enableRocks" type="checkbox" checked>

<label>Rock Density</label>
<input id="rockDensity" type="range" min="0" max="300" value="120">

<label>Cloud Height</label>
<input id="cloudHeight" type="range" min="1.01" max="1.15" step="0.01" value="1.04">

<label>Atmosphere Height</label>
<input id="atmoHeight" type="range" min="1.02" max="1.3" step="0.01" value="1.08">

<label>Ring Size</label>
<input id="ringSize" type="range" min="1.3" max="3" step="0.1" value="1.8">

<label>Galaxy Scale</label>
<input id="galaxyScale" type="range" min="1000" max="25000" value="6000">

<label>Surface Color</label>
<input id="color1" type="color" value="#557755">

<label>Secondary Color</label>
<input id="color2" type="color" value="#888866">


<label>Atmosphere Color</label>
<input id="atmoColor" type="color" value="#88bbff">

<label>Cloud Color</label>
<input id="cloudColor" type="color" value="#ffffff">

<label>Ocean Color</label>
<input id="oceanColor" type="color" value="#3366aa">

<label>Ocean Height</label>
<input id="oceanHeight" type="range" min="1.001" max="1.03" step="0.001" value="1.006">

<label>Enable Water</label>
<input id="enableWater" type="checkbox" checked>

<label>Enable Atmosphere</label>
<input id="enableAtmo" type="checkbox" checked>

<label>Enable Clouds</label>
<input id="enableClouds" type="checkbox" checked>

<label>Enable Rings</label>
<input id="enableRings" type="checkbox">

<button id="previewBtn">Create Preview</button>


<div style="margin-top:16px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2)">
<h3>Simulation</h3>

<label>Global Time Speed</label>
<input id="timeScale" type="range" min="0" max="500" value="25">

<p id="speedText">Speed: 1x</p>
</div>

<h3>Catalog</h3>
<div id="catalog"></div>

</div>

<div id="crosshair"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,2000000
);

camera.position.set(0,20,150);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.3;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1));

const light = new THREE.PointLight(0xffffff,12);
light.position.set(1000,1000,1000);
scene.add(light);

const starGeo = new THREE.BufferGeometry();
const verts=[];

for(let i=0;i<100000;i++){
verts.push((Math.random()-.5)*900000);
verts.push((Math.random()-.5)*900000);
verts.push((Math.random()-.5)*900000);
}

starGeo.setAttribute(
'position',
new THREE.Float32BufferAttribute(verts,3)
);

scene.add(new THREE.Points(
starGeo,
new THREE.PointsMaterial({
size:3,
color:0xffffff
})
));

let yaw=0;
let pitch=0;
let roll=0;
let speedMultiplier=1;

const keys={};

addEventListener('keydown',e=>{

keys[e.key.toLowerCase()] = true;

if(e.key==='1') speedMultiplier*=0.5;
if(e.key==='2') speedMultiplier*=2;

if(e.key.toLowerCase()==='m'){
ui.style.display=ui.style.display==='none'?'block':'none';
}

if(e.key.toLowerCase()==='p'){
placePreview();
}

if(e.key.toLowerCase()==='l'){
saveNearest();
}

});

addEventListener('keyup',e=>{
keys[e.key.toLowerCase()] = false;
});

renderer.domElement.addEventListener('click',()=>{
renderer.domElement.requestPointerLock();
});

addEventListener('mousemove',e=>{
if(document.pointerLockElement===renderer.domElement){
yaw-=e.movementX*0.002;
pitch-=e.movementY*0.002;
pitch=Math.max(-1.5,Math.min(1.5,pitch));
}
});

let preview=null;
const objects=[];
const catalogEntries=[];

function planetTexture(c1,c2){

const canvas=document.createElement('canvas');
canvas.width=2048;
canvas.height=1024;

const ctx=canvas.getContext('2d');

ctx.fillStyle=c1;
ctx.fillRect(0,0,2048,1024);

for(let i=0;i<70000;i++){

ctx.fillStyle=Math.random()>.5?c1:c2;
ctx.globalAlpha=.35;

ctx.beginPath();
ctx.arc(
Math.random()*2048,
Math.random()*1024,
10+Math.random()*80,
0,
Math.PI*2
);

ctx.fill();
}

return new THREE.CanvasTexture(canvas);
}

function cloudTexture(){

const canvas=document.createElement('canvas');
canvas.width=2048;
canvas.height=1024;

const ctx=canvas.getContext('2d');

for(let i=0;i<80000;i++){

ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.08})`;

ctx.beginPath();
ctx.arc(
Math.random()*2048,
Math.random()*1024,
8+Math.random()*50,
0,
Math.PI*2
);

ctx.fill();
}

return new THREE.CanvasTexture(canvas);
}

function buildObject(data){

const group=new THREE.Group();

if(data.type==='galaxy'){

const gGeo=new THREE.BufferGeometry();
const gVerts=[];
const colors=[];

for(let i=0;i<70000;i++){

const angle=Math.random()*Math.PI*2;
const radius=Math.random()*+galaxyScale.value;
const spiral=angle*(0.5 + (+galaxyScale.value/4000));

const x=Math.cos(angle+spiral)*radius;
const y=(Math.random()-.5)*500;
const z=Math.sin(angle+spiral)*radius;

gVerts.push(x,y,z);

colors.push(
0.5+Math.random()*0.5,
0.2+Math.random()*0.3,
0.8+Math.random()*0.2
);

}

gGeo.setAttribute(
'position',
new THREE.Float32BufferAttribute(gVerts,3)
);

gGeo.setAttribute(
'color',
new THREE.Float32BufferAttribute(colors,3)
);

const galaxy=new THREE.Points(
gGeo,
new THREE.PointsMaterial({
size:8,
vertexColors:true,
transparent:true,
opacity:.9
})
);

group.add(galaxy);

return {group,radius:6000,type:'galaxy'};
}

const geo=new THREE.SphereGeometry(data.radius,256,256);

if(data.type==='planet'){

const pos=geo.attributes.position;

for(let i=0;i<pos.count;i++){

const v=new THREE.Vector3().fromBufferAttribute(pos,i);

const continentScale =
0.00035 + (data.continentSize * 0.00004);

const detailScale =
0.01 + (data.continentDetail * 0.002);

const continents =
Math.sin(v.x * continentScale) *
Math.cos(v.z * continentScale) *
Math.sin(v.y * continentScale);

const continentDetail =
Math.sin(v.x * detailScale) *
Math.cos(v.z * detailScale) *
0.12;

const hills =
Math.sin(v.x * 0.03) *
Math.cos(v.z * 0.03) *
0.015;

const valleys =
-Math.abs(
Math.sin(v.y * 0.025) *
Math.cos(v.x * 0.025)
) * 0.012;

const terrain =
(continents * 0.035) +
(continentDetail * (data.mountainScale * 0.00035)) +
hills +
valleys;

const terrainAmount =
terrain * (data.terrainHeight * 0.03);

v.normalize().multiplyScalar(
data.radius + (terrainAmount * data.radius)
);

pos.setXYZ(i,v.x,v.y,v.z);
}

geo.computeVertexNormals();
}

let material=new THREE.MeshPhysicalMaterial({
map:planetTexture(data.color1,data.color2),
roughness:.9
});

if(data.type==='star'){
material.emissive=new THREE.Color(data.color1);
material.emissiveIntensity=6;
}

if(data.type==='blackhole'){
material=new THREE.MeshPhysicalMaterial({
color:0x000000,
emissive:0x220044,
emissiveIntensity:0.4,
roughness:0
});
}


if(data.type==='gas'){

const gasCanvas=document.createElement('canvas');
gasCanvas.width=2048;
gasCanvas.height=1024;

const gctx=gasCanvas.getContext('2d');

for(let y=0;y<1024;y++){

const hue=120+Math.sin(y*0.02)*40;

gctx.fillStyle=`hsl(${hue},40%,${45+Math.sin(y*0.04)*12}%)`;
gctx.fillRect(0,y,2048,1);
}

for(let i=0;i<120;i++){

gctx.fillStyle=`rgba(255,255,255,${0.08+Math.random()*0.2})`;

gctx.beginPath();
gctx.ellipse(
Math.random()*2048,
Math.random()*1024,
30+Math.random()*120,
15+Math.random()*60,
Math.random()*Math.PI,
0,
Math.PI*2
);

gctx.fill();
}

material.map = new THREE.CanvasTexture(gasCanvas);

}

const mesh=new THREE.Mesh(geo,material);
group.add(mesh);

if(data.enableWater && data.type==='planet'){
group.add(new THREE.Mesh(
new THREE.SphereGeometry(data.radius*data.oceanHeight,128,128),
new THREE.MeshPhysicalMaterial({
color:data.oceanColor,
transparent:true,
opacity:.35
})
));
}

if(data.enableAtmo && data.type==='planet'){

group.add(new THREE.Mesh(
new THREE.SphereGeometry(data.radius*data.atmoHeight,128,128),
new THREE.MeshPhysicalMaterial({
color:data.atmoColor,
transparent:true,
opacity:.15,
side:THREE.BackSide
})
));

if(data.enableClouds){

group.add(new THREE.Mesh(
new THREE.SphereGeometry(
data.radius*Math.min(data.cloudHeight,data.atmoHeight-.01),
128,
128
),
new THREE.MeshPhysicalMaterial({
map:cloudTexture(), color:data.cloudColor,
transparent:true,
opacity:.72,
depthWrite:false, roughness:0.9
})
));

}
}


if(data.type==='planet'){

if(data.enableTrees){

for(let i=0;i<data.treeDensity;i++){

const theta=Math.random()*Math.PI*2;
const phi=Math.acos(2*Math.random()-1);

const nx=Math.sin(phi)*Math.cos(theta);
const ny=Math.cos(phi);
const nz=Math.sin(phi)*Math.sin(theta);

const normal=new THREE.Vector3(nx,ny,nz);

const tree=new THREE.Mesh(
new THREE.ConeGeometry(.18,.9,6),
new THREE.MeshStandardMaterial({color:0x225522})
);

tree.position.copy(
normal.clone().multiplyScalar(
data.radius+0.25
)
);

tree.quaternion.setFromUnitVectors(
new THREE.Vector3(0,1,0),
normal
);

group.add(tree);
}
}

if(data.enableRocks){

for(let i=0;i<data.rockDensity;i++){

const theta=Math.random()*Math.PI*2;
const phi=Math.acos(2*Math.random()-1);

const nx=Math.sin(phi)*Math.cos(theta);
const ny=Math.cos(phi);
const nz=Math.sin(phi)*Math.sin(theta);

const normal=new THREE.Vector3(nx,ny,nz);

const rock=new THREE.Mesh(
new THREE.DodecahedronGeometry(0.08+Math.random()*0.2),
new THREE.MeshStandardMaterial({color:0x777777})
);

rock.position.copy(
normal.clone().multiplyScalar(
data.radius+0.12
)
);

rock.quaternion.setFromUnitVectors(
new THREE.Vector3(0,1,0),
normal
);

group.add(rock);
}
}

}

if(data.enableRings){

const ringGeo=new THREE.RingGeometry(
data.radius*data.ringSize,
data.radius*(data.ringSize+.7),
512
);

const ringCanvas=document.createElement('canvas');
ringCanvas.width=2048;
ringCanvas.height=2048;

const ctx=ringCanvas.getContext('2d');
const center=1024;

for(let y=0;y<2048;y++){
for(let x=0;x<2048;x++){

const dx=x-center;
const dy=y-center;

const dist=Math.sqrt(dx*dx+dy*dy);

if(dist>500 && dist<980){

const band=
Math.sin(dist*0.03)*0.5+
Math.sin(dist*0.007)*0.5;

const alpha=0.15+Math.abs(band)*0.8;

ctx.fillStyle=`rgba(220,220,220,${alpha})`;
ctx.fillRect(x,y,1,1);
}
}
}

const ring=new THREE.Mesh(
ringGeo,
new THREE.MeshPhysicalMaterial({
map:new THREE.CanvasTexture(ringCanvas),
transparent:true,
side:THREE.DoubleSide,
opacity:.9
})
);

ring.rotation.x=Math.PI/2;
group.add(ring);

}

return {
group,
radius:data.radius,
type:data.type
};

}

function data(){
return {
type:type.value,
radius:+radius.value,
continentSize:+continentSize.value,
mountainScale:+mountainScale.value,
terrainHeight:+terrainHeight.value,
continentDetail:+continentDetail.value,
enableTrees:enableTrees.checked,
treeDensity:+treeDensity.value,
enableRocks:enableRocks.checked,
rockDensity:+rockDensity.value,
cloudHeight:+cloudHeight.value,
atmoHeight:+atmoHeight.value,
ringSize:+ringSize.value,
color1:color1.value,
color2:color2.value,
atmoColor:atmoColor.value,
cloudColor:cloudColor.value,
oceanColor:oceanColor.value,
oceanHeight:+oceanHeight.value,
enableWater:enableWater.checked,
enableAtmo:enableAtmo.checked,
enableClouds:enableClouds.checked,
enableRings:enableRings.checked
};
}

function createPreview(){

if(preview){
scene.remove(preview.group);
}

preview=buildObject(data());

scene.add(preview.group);
}

function placePreview(){

if(!preview)return;

preview.group.position.copy(
camera.position.clone().add(
new THREE.Vector3(0,0,-220)
.applyQuaternion(camera.quaternion)
)
);

for(const obj of objects){

if(obj.type==='galaxy' &&
(preview.type==='star' || preview.type==='blackhole')){

preview.orbitGalaxy=obj;
preview.orbitRadius=
preview.group.position.distanceTo(obj.group.position);

preview.orbitAngle=Math.random()*Math.PI*2;
preview.orbitSpeed=0.0001+Math.random()*0.0002;
}
}

objects.push(preview);
preview=null;
}

function saveNearest(){

let closest=null;
let closestDist=Infinity;

for(const obj of objects){

const d=camera.position.distanceTo(obj.group.position);

if(d<closestDist){
closest=obj;
closestDist=d;
}
}

if(!closest)return;

catalogEntries.push(closest);

const div=document.createElement('div');
div.className='catalogItem';
div.innerText=closest.type+" "+catalogEntries.length;

div.onclick=()=>{
camera.position.copy(
closest.group.position.clone().add(
new THREE.Vector3(0,closest.radius+30,closest.radius+50)
)
);
};

catalog.appendChild(div);
}

previewBtn.onclick=createPreview;

function movement(){

camera.rotation.order='YXZ';
camera.rotation.y=yaw;
camera.rotation.x=pitch;
camera.rotation.z=roll;

if(keys.q)roll+=0.02;
if(keys.e)roll-=0.02;

const speed=(keys.shift?12:3)*speedMultiplier;

const forward=
new THREE.Vector3(0,0,-1)
.applyQuaternion(camera.quaternion);

const right=
new THREE.Vector3(1,0,0)
.applyQuaternion(camera.quaternion);

const up=
new THREE.Vector3(0,1,0);

if(keys.w)camera.position.add(forward.clone().multiplyScalar(speed));
if(keys.s)camera.position.add(forward.clone().multiplyScalar(-speed));
if(keys.a)camera.position.add(right.clone().multiplyScalar(-speed));
if(keys.d)camera.position.add(right.clone().multiplyScalar(speed));
if(keys[' '])camera.position.add(up.clone().multiplyScalar(speed));
if(keys.control)camera.position.add(up.clone().multiplyScalar(-speed));

for(const obj of objects){

const dist=camera.position.distanceTo(obj.group.position);

if(obj.type!=='galaxy' && dist<obj.radius+0.25){

const normal=
camera.position.clone()
.sub(obj.group.position)
.normalize();

camera.position.copy(
obj.group.position.clone().add(
normal.multiplyScalar(obj.radius+0.25)
)
);

camera.up.lerp(normal,0.08);
}

if(obj.orbitGalaxy){

obj.orbitAngle+=obj.orbitSpeed;

obj.group.position.x=
obj.orbitGalaxy.group.position.x+
Math.cos(obj.orbitAngle)*obj.orbitRadius;

obj.group.position.z=
obj.orbitGalaxy.group.position.z+
Math.sin(obj.orbitAngle)*obj.orbitRadius;
}
}
}

function animate(){

requestAnimationFrame(animate);

movement();

if(preview){

preview.group.position.copy(
camera.position.clone().add(
new THREE.Vector3(0,0,-140)
.applyQuaternion(camera.quaternion)
)
);
}



speedText.innerText =
'Speed: ' + (timeScale.value/25).toFixed(1) + 'x';

for(const obj of objects){

if(obj.orbitGalaxy){

obj.orbitAngle +=
obj.orbitSpeed *
(+timeScale.value * 0.01);

obj.group.position.x =
obj.orbitGalaxy.group.position.x +
Math.cos(obj.orbitAngle) *
obj.orbitRadius;

obj.group.position.z =
obj.orbitGalaxy.group.position.z +
Math.sin(obj.orbitAngle) *
obj.orbitRadius;

}
}

renderer.render(scene,camera);
}

animate();

onresize=()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
